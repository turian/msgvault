name: Gmail archived label reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  label-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: msgvault_test
          POSTGRES_PASSWORD: msgvault_test
          POSTGRES_DB: msgvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U msgvault_test -d msgvault_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GOFLAGS: -trimpath
      GOPROXY: https://proxy.golang.org|direct
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 403b6c7bd366ea9408619fe773a7fc64cb86cd7c
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting and sync analysis
        run: |
          go fmt ./...
          git diff --exit-code
          go vet -tags "fts5 sqlite_vec" ./internal/sync
      - name: Reproduce historical label drift on SQLite
        run: go test -tags "fts5 sqlite_vec" ./internal/sync -run '^TestGmailArchivedLabelDriftNeedsCompleteRefresh$' -count=1 -v
      - name: Reproduce historical label drift on PostgreSQL
        env:
          MSGVAULT_TEST_DB: postgres://msgvault_test:msgvault_test@localhost:5432/msgvault_test?sslmode=disable
        run: go test -tags "fts5 sqlite_vec" ./internal/sync -run '^TestGmailArchivedLabelDriftNeedsCompleteRefresh$' -count=1 -v
