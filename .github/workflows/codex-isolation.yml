name: Gmail archived label refresh checks
on:
  workflow_dispatch:
    inputs:
      build_archive_probe:
        description: Build the offline native archive label probe only
        type: boolean
        default: false
      generate_assets_only:
        description: Produce canonical API assets without claiming test verification
        type: boolean
        default: false
      source_ref:
        description: Exact public source commit to check out
        type: string
        default: f9ae09ac8290a3a2ece42dd25e58f93c2d50d312
      source_patch:
        description: Optional gzip/base64 patch for checking a prepared merge before committing
        type: string
        default: ''
      source_patch_sha:
        description: SHA256 of the decoded patch
        type: string
        default: ''
      contract_base:
        description: Exact upstream API contract base
        type: string
        default: 4beb0f14982511f2cbc9bdbfef52def93ee2840a
permissions:
  contents: read
jobs:
  label-drift:
    if: ${{ !inputs.build_archive_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: msgvault_test
          POSTGRES_PASSWORD: msgvault_test
          POSTGRES_DB: msgvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U msgvault_test -d msgvault_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GOFLAGS: -trimpath
      GOPROXY: https://proxy.golang.org|direct
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the prepared source patch
        env:
          SOURCE_PATCH: ${{ inputs.source_patch }}
          SOURCE_PATCH_SHA: ${{ inputs.source_patch_sha }}
        run: |
          python3 - <<'PYAPPLY'
          import base64, gzip, hashlib, json, os, subprocess
          encoded = os.environ['SOURCE_PATCH']
          if encoded:
              patch = gzip.decompress(base64.b64decode(encoded, validate=True))
              digest = hashlib.sha256(patch).hexdigest()
              assert digest == os.environ['SOURCE_PATCH_SHA'], 'source patch digest mismatch'
              subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          source_receipt = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'source_tree': subprocess.check_output(['git', 'write-tree'], text=True).strip(), 'patch_sha256': os.environ['SOURCE_PATCH_SHA']}
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'label-source.json'), 'w') as f:
              json.dump(source_receipt, f)
          print(json.dumps(source_receipt))
          PYAPPLY
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      - uses: step-security/setup-bun@v2.1.3
        with:
          bun-version-file: web/package.json
      - name: Regenerate API assets and contract marker
        env:
          GENERATE_ASSETS_ONLY: ${{ inputs.generate_assets_only }}
        run: |
          set -euo pipefail
          make api-generate
          make web-generate
          marker_helper=internal/api/label_refresh_generation_test.go
          test ! -e "$marker_helper"
          trap 'rm -f "$marker_helper"' EXIT
          cat > "$marker_helper" <<'GO'
          package api
          import (
            "crypto/sha256"
            "fmt"
            "os"
            "path/filepath"
            "testing"
            "github.com/stretchr/testify/require"
          )
          func TestGenerateLabelRefreshContractMarker(t *testing.T) {
            const summary = "Add explicit archived Gmail label refresh to CLI full sync."
            digest := apiContractDigest(t, OpenAPIDocument(), openAPIClientDocument())
            name := fmt.Sprintf("%s_%s_%x", APISchemaVersion, digest, sha256.Sum256([]byte(summary)))
            require.NoError(t, os.WriteFile(filepath.Join(apiContractsDir, name), []byte(summary+"\n"), 0644))
          }
          GO
          gofmt -w "$marker_helper"
          go test -tags "fts5 sqlite_vec" ./internal/api -run '^TestGenerateLabelRefreshContractMarker$' -count=1
          rm "$marker_helper"
          trap - EXIT
          git add -N internal/api/testdata/api-version-contracts
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          paths = ['api/openapi.yaml', 'pkg/client/openapi.yaml', 'pkg/client/generated', 'web/src/lib/api/generated', 'internal/api/testdata/api-version-contracts']
          patch = subprocess.check_output(['git', 'diff', '--binary', '--'] + paths)
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'label-refresh-generated'
          target.mkdir()
          (target / 'generated.patch').write_bytes(patch)
          receipt = {'base_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'source_tree': json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'label-source.json').read_text())['source_tree'], 'generated_patch_sha256': hashlib.sha256(patch).hexdigest()}
          (target / 'receipt.json').write_text(json.dumps(receipt, indent=2))
          print(json.dumps(receipt))
          PY
          if [ "$GENERATE_ASSETS_ONLY" != "true" ]; then
            git diff --exit-code -- api/openapi.yaml pkg/client/openapi.yaml pkg/client/generated web/src/lib/api/generated internal/api/testdata/api-version-contracts
          fi
      - name: Save canonical generated changes
        uses: actions/upload-artifact@v7.0.2
        with:
          name: label-refresh-generated
          path: ${{ runner.temp }}/label-refresh-generated
          retention-days: 3
          if-no-files-found: error
      - name: Check formatting and static analysis
        if: ${{ !inputs.generate_assets_only }}
        run: |
          set -euo pipefail
          go fmt ./...
          git diff --check
          git diff --exit-code -- . ':!api/openapi.yaml' ':!pkg/client' ':!internal/api/testdata/api-version-contracts'
          go vet -tags "fts5 sqlite_vec" ./...
      - name: Check Gmail refresh, recovery, daemon, CLI and cache journeys
        if: ${{ !inputs.generate_assets_only }}
        env:
          MSGVAULT_API_CONTRACT_BASE: ${{ inputs.contract_base }}
        run: go test -tags "fts5 sqlite_vec" ./internal/sync ./internal/api ./internal/daemonclient ./cmd/msgvault/cmd -run '^(TestGmail.*|TestRunScheduledIMAPSync_AllMailCombinedRolesKeepTrashMark|TestHandleCLISync.*|TestRunCLISync.*|TestSyncFull.*|TestCLISyncSubprocess.*|TestCacheNeedsBuildTracksCoveredRelatedRows|TestAPISchemaVersionContract|TestSyncResumeCommandNativeArguments)$' -count=1 -v
      - name: Check the built CLI and browser contracts
        if: ${{ !inputs.generate_assets_only }}
        run: |
          set -euo pipefail
          make web-check web-build
          go build -tags "fts5 sqlite_vec" -o "$RUNNER_TEMP/msgvault-cli" ./cmd/msgvault
          python3 - <<'PYCLI'
          import os, pathlib, subprocess, tempfile
          binary = str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'msgvault-cli')
          root = tempfile.mkdtemp(prefix='msgvault-cli-proof-')
          env = dict(os.environ, HOME=root, MSGVAULT_HOME=root)
          for args, expected in [
              (['sync-full', '--refresh-labels', '--source-id=42', '--source-id=43'], '--source-id to appear once'),
              (['sync-full', '--source-id=42', '--source-id=43', '--refresh-labels'], '--source-id to appear once'),
              (['sync-full', '--refresh-labels', '--refresh-labels=false', 'reader@example.test'], '--refresh-labels must appear once'),
          ]:
              result = subprocess.run([binary, *args], env=env, capture_output=True, text=True, timeout=20)
              assert result.returncode != 0, args
              assert expected in result.stdout + result.stderr, (args, result.stdout, result.stderr)
          print('PASS: production CLI rejects duplicate repair selectors in either flag order')
          PYCLI
      - uses: astral-sh/setup-uv@v10.3.3
        if: ${{ !inputs.generate_assets_only }}
        with:
          save-cache: false
      - name: Check documentation
        if: ${{ !inputs.generate_assets_only }}
        run: make docs-check
      - name: Check repository lint
        if: ${{ !inputs.generate_assets_only }}
        run: make lint-ci
      - name: Check label Store behavior on SQLite
        if: ${{ !inputs.generate_assets_only }}
        run: go test -tags "fts5 sqlite_vec" ./internal/store -run '^(TestStore_EnsureLabelsBatch.*|TestStore_ReconcileMessageLabelsReportsChanges|TestReconcileMessageLabelsTxContext_CancelledContextStopsItsStatements)$' -count=1 -v
      - name: Check Gmail label refresh on PostgreSQL
        if: ${{ !inputs.generate_assets_only }}
        env:
          MSGVAULT_TEST_DB: postgres://msgvault_test:msgvault_test@localhost:5432/msgvault_test?sslmode=disable
        run: go test -tags "fts5 sqlite_vec" ./internal/sync -run '^TestGmail(FullLabelRefresh.*|ArchivedLabelDriftNeedsCompleteRefresh|LabelSnapshotConvergesAfterOlderHistoryReplay|RecoveryReplacesArchivedLabels|OrdinaryFullKeepsExistingRawShortcut)$' -count=1 -v
      - name: Check label Store behavior on PostgreSQL
        if: ${{ !inputs.generate_assets_only }}
        env:
          MSGVAULT_TEST_DB: postgres://msgvault_test:msgvault_test@localhost:5432/msgvault_test?sslmode=disable
        run: go test -tags "fts5 sqlite_vec" ./internal/store -run '^(TestStore_EnsureLabelsBatch.*|TestStore_ReconcileMessageLabelsReportsChanges|TestReconcileMessageLabelsTxContext_CancelledContextStopsItsStatements)$' -count=1 -v
  archive-probe:
    if: ${{ inputs.build_archive_probe }}
    runs-on: macos-26
    timeout-minutes: 25
    env:
      GOFLAGS: -trimpath
      MACOSX_DEPLOYMENT_TARGET: "26.0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          path: feature
          persist-credentials: false
      - name: Apply the prepared archive probe source
        working-directory: feature
        env:
          SOURCE_PATCH: ${{ inputs.source_patch }}
          SOURCE_PATCH_SHA: ${{ inputs.source_patch_sha }}
        run: |
          python3 - <<'PYAPPLY'
          import base64, gzip, hashlib, json, os, subprocess
          encoded = os.environ['SOURCE_PATCH']
          if encoded:
              patch = gzip.decompress(base64.b64decode(encoded, validate=True))
              digest = hashlib.sha256(patch).hexdigest()
              assert digest == os.environ['SOURCE_PATCH_SHA'], 'source patch digest mismatch'
              subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          source_receipt = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'source_tree': subprocess.check_output(['git', 'write-tree'], text=True).strip(), 'patch_sha256': os.environ['SOURCE_PATCH_SHA']}
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'archive-source.json'), 'w') as f:
              json.dump(source_receipt, f)
          print(json.dumps(source_receipt))
          PYAPPLY
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: feature/go.mod
          cache: true
          cache-dependency-path: feature/go.sum
      - name: Compile the offline test driver from public source
        env:
          SOURCE_PATCH_SHA: ${{ inputs.source_patch_sha }}
        working-directory: feature
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = arm64
          mkdir internal/labelprobe
          cp ../scripts/label-refresh-probe/probe_test.go internal/labelprobe/probe_test.go
          go vet -tags "fts5 sqlite_vec" ./internal/labelprobe
          go test -c -tags "fts5 sqlite_vec" -o ../archive-label-probe.test ./internal/labelprobe
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('..')
          artifact = root / 'archive-label-probe.test'
          receipt = {
              'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'source_tree': json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'archive-source.json').read_text())['source_tree'],
              'patch_sha256': os.environ['SOURCE_PATCH_SHA'],
              'driver_commit': os.environ['GITHUB_SHA'],
              'driver_sha256': hashlib.sha256((root / 'scripts/label-refresh-probe/probe_test.go').read_bytes()).hexdigest(),
              'artifact_sha256': hashlib.sha256(artifact.read_bytes()).hexdigest(),
              'private_data_in_build': False,
          }
          (root / 'archive-label-probe-build.json').write_text(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: archive-label-probe-darwin-arm64
          path: |
            archive-label-probe.test
            archive-label-probe-build.json
          retention-days: 1
          if-no-files-found: error
