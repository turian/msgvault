name: Gmail archived label refresh checks
on:
  workflow_dispatch:
    inputs:
      build_archive_probe:
        description: Build the offline native archive label probe only
        type: boolean
        default: false
      generate_assets_only:
        description: Produce canonical API assets without claiming test verification
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  label-drift:
    if: ${{ !inputs.build_archive_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: msgvault_test
          POSTGRES_PASSWORD: msgvault_test
          POSTGRES_DB: msgvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U msgvault_test -d msgvault_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GOFLAGS: -trimpath
      GOPROXY: https://proxy.golang.org|direct
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 5a3d943cb70e1eda793fd888c3f5529369795a36
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Regenerate API assets and contract marker
        env:
          GENERATE_ASSETS_ONLY: ${{ inputs.generate_assets_only }}
        run: |
          set -euo pipefail
          make api-generate
          marker_helper=internal/api/label_refresh_generation_test.go
          test ! -e "$marker_helper"
          trap 'rm -f "$marker_helper"' EXIT
          cat > "$marker_helper" <<'GO'
          package api
          import (
            "crypto/sha256"
            "fmt"
            "os"
            "path/filepath"
            "testing"
            "github.com/stretchr/testify/require"
          )
          func TestGenerateLabelRefreshContractMarker(t *testing.T) {
            const summary = "Add explicit archived Gmail label refresh to CLI full sync."
            digest := apiContractDigest(t, OpenAPIDocument(), openAPIClientDocument())
            name := fmt.Sprintf("%s_%s_%x", APISchemaVersion, digest, sha256.Sum256([]byte(summary)))
            require.NoError(t, os.WriteFile(filepath.Join(apiContractsDir, name), []byte(summary+"\n"), 0644))
          }
          GO
          gofmt -w "$marker_helper"
          go test -tags "fts5 sqlite_vec" ./internal/api -run '^TestGenerateLabelRefreshContractMarker$' -count=1
          rm "$marker_helper"
          trap - EXIT
          git add -N internal/api/testdata/api-version-contracts
          python3 - <<'PY'
          import base64, gzip, hashlib, json, subprocess
          paths = ['api/openapi.yaml', 'pkg/client/openapi.yaml', 'pkg/client/generated', 'internal/api/testdata/api-version-contracts']
          patch = subprocess.check_output(['git', 'diff', '--binary', '--'] + paths)
          print(json.dumps({'msgvault_generated_patch': base64.b64encode(gzip.compress(patch)).decode(), 'sha256': hashlib.sha256(patch).hexdigest()}))
          PY
          if [ "$GENERATE_ASSETS_ONLY" != "true" ]; then
            git diff --exit-code -- api/openapi.yaml pkg/client/openapi.yaml pkg/client/generated internal/api/testdata/api-version-contracts
          fi
      - name: Check formatting and static analysis
        if: ${{ !inputs.generate_assets_only }}
        run: |
          set -euo pipefail
          go fmt ./...
          git diff --check
          git diff --exit-code -- . ':!api/openapi.yaml' ':!pkg/client' ':!internal/api/testdata/api-version-contracts'
          go vet -tags "fts5 sqlite_vec" ./...
      - name: Check Gmail refresh, recovery, daemon, CLI and cache journeys
        if: ${{ !inputs.generate_assets_only }}
        env:
          MSGVAULT_API_CONTRACT_BASE: 9d0b00b3798ed05483d42363064da8322c5da8f3
        run: go test -tags "fts5 sqlite_vec" ./internal/sync ./internal/api ./internal/daemonclient ./cmd/msgvault/cmd -run '^(TestGmail.*|TestHandleCLISync.*|TestRunCLISync.*|TestSyncFull.*|TestCLISyncSubprocess.*|TestCacheNeedsBuildTracksCoveredRelatedRows|TestAPISchemaVersionContract|TestSyncResumeCommandNativeArguments)$' -count=1 -v
      - name: Check repository lint
        if: ${{ !inputs.generate_assets_only }}
        run: make lint-ci
      - name: Check label Store behavior on SQLite
        if: ${{ !inputs.generate_assets_only }}
        run: go test -tags "fts5 sqlite_vec" ./internal/store -run '^(TestStore_EnsureLabelsBatch.*|TestStore_ReconcileMessageLabelsReportsChanges|TestReconcileMessageLabelsTxContext_CancelledContextStopsItsStatements)$' -count=1 -v
      - name: Check Gmail label refresh on PostgreSQL
        if: ${{ !inputs.generate_assets_only }}
        env:
          MSGVAULT_TEST_DB: postgres://msgvault_test:msgvault_test@localhost:5432/msgvault_test?sslmode=disable
        run: go test -tags "fts5 sqlite_vec" ./internal/sync -run '^TestGmail(FullLabelRefresh.*|ArchivedLabelDriftNeedsCompleteRefresh|LabelSnapshotConvergesAfterOlderHistoryReplay|RecoveryReplacesArchivedLabels|OrdinaryFullKeepsExistingRawShortcut)$' -count=1 -v
      - name: Check label Store behavior on PostgreSQL
        if: ${{ !inputs.generate_assets_only }}
        env:
          MSGVAULT_TEST_DB: postgres://msgvault_test:msgvault_test@localhost:5432/msgvault_test?sslmode=disable
        run: go test -tags "fts5 sqlite_vec" ./internal/store -run '^(TestStore_EnsureLabelsBatch.*|TestStore_ReconcileMessageLabelsReportsChanges|TestReconcileMessageLabelsTxContext_CancelledContextStopsItsStatements)$' -count=1 -v
  archive-probe:
    if: ${{ inputs.build_archive_probe }}
    runs-on: macos-26
    timeout-minutes: 25
    env:
      GOFLAGS: -trimpath
      MACOSX_DEPLOYMENT_TARGET: "26.0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: 332cddf207e645989436a8e73551c0db170a572b
          path: feature
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: feature/go.mod
          cache: true
          cache-dependency-path: feature/go.sum
      - name: Compile the offline test driver from public source
        working-directory: feature
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = arm64
          mkdir internal/labelprobe
          cp ../scripts/label-refresh-probe/probe_test.go internal/labelprobe/probe_test.go
          go vet -tags "fts5 sqlite_vec" ./internal/labelprobe
          go test -c -tags "fts5 sqlite_vec" -o ../archive-label-probe.test ./internal/labelprobe
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('..')
          artifact = root / 'archive-label-probe.test'
          receipt = {
              'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'driver_commit': os.environ['GITHUB_SHA'],
              'driver_sha256': hashlib.sha256((root / 'scripts/label-refresh-probe/probe_test.go').read_bytes()).hexdigest(),
              'artifact_sha256': hashlib.sha256(artifact.read_bytes()).hexdigest(),
              'private_data_in_build': False,
          }
          (root / 'archive-label-probe-build.json').write_text(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: archive-label-probe-darwin-arm64
          path: |
            archive-label-probe.test
            archive-label-probe-build.json
          retention-days: 1
          if-no-files-found: error
