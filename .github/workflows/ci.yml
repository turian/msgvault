name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  imap-restore-path-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOFLAGS: -trimpath
      GOPROXY: https://proxy.golang.org|direct
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: c97dc1c23c84da17ee1ca1d69ab9031d6c17ca96
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify each restore guard independently
        run: |
          python3 - <<'PYVERIFY'
          import json, os, subprocess
          from pathlib import Path
          target=Path('internal/store/imap_memberships.go')
          original=target.read_text()
          cases=[
              ('complete', 'if normalized.delta.AllMail {', 'if false {', 'filtered=false'),
              ('filtered', ' || observation.AllMail', '', 'filtered=true'),
          ]
          try:
              for name, old, new, expected in cases:
                  assert original.count(old)==1
                  target.write_text(original.replace(old,new))
                  result=subprocess.run(['go','test','-json','-tags','fts5 sqlite_vec','./cmd/msgvault/cmd','-run','^TestRunScheduledIMAPSync_AllMailCombinedRolesKeepTrashMark$','-count=1'],text=True,capture_output=True)
                  Path(os.environ['RUNNER_TEMP'], name+'.json').write_text(result.stdout)
                  assert result.returncode==1, result.stderr+result.stdout
                  events=[json.loads(line) for line in result.stdout.splitlines()]
                  failures=[e['Test'] for e in events if e.get('Action')=='fail' and '/' in e.get('Test','')]
                  passes=[e['Test'] for e in events if e.get('Action')=='pass' and '/' in e.get('Test','')]
                  output=''.join(e.get('Output','') for e in events)
                  assert len(failures)==3 and all(x.endswith(expected) for x in failures), failures
                  assert len(passes)==3, passes
                  assert output.count('All Mail sightings do not prove a restore')==3, output
                  print('PASS:', name, 'guard removal fails its three cases; the other three still pass', flush=True)
          finally:
              target.write_text(original)
          PYVERIFY
          git diff --exit-code
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: imap-restore-path-controls
          path: |
            ${{ runner.temp }}/complete.json
            ${{ runner.temp }}/filtered.json
          retention-days: 3
          if-no-files-found: ignore
