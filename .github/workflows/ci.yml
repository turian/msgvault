name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  imap-all-mail-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: msgvault_test
          POSTGRES_PASSWORD: msgvault_test
          POSTGRES_DB: msgvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U msgvault_test -d msgvault_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GOFLAGS: -trimpath
      GOPROXY: https://proxy.golang.org|direct
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: c97dc1c23c84da17ee1ca1d69ab9031d6c17ca96
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting and static analysis
        run: |
          go fmt ./...
          git diff --exit-code
          go vet ./...
      - name: Exercise patched sync with SQLite and real IMAP protocol
        run: |
          go test -v -tags "fts5 sqlite_vec" ./cmd/msgvault/cmd -run '^TestRunScheduledIMAPSync_AllMailCombinedRolesKeepTrashMark$' -count=1
          go test -tags "fts5 sqlite_vec" ./internal/imap ./internal/store ./cmd/msgvault/cmd -run 'Test.*(IMAP|Mailbox|SystemRole|ConfiguredSentPlacement)' -count=1
      - name: Exercise restore SQL on PostgreSQL
        env:
          MSGVAULT_TEST_DB: postgres://msgvault_test:msgvault_test@localhost:5432/msgvault_test?sslmode=disable
        run: |
          go test -tags "fts5 sqlite_vec" ./internal/store ./cmd/msgvault/cmd -run 'TestRunScheduledIMAPSync_AllMailCombinedRolesKeepTrashMark|TestApplyIMAPMailboxDeltas_TrashAndAll|TestFilteredIMAPRestore|TestClearRestoredIMAP' -count=1
      - name: Prove regression fails on unchanged PR head
        run: |
          git diff 9eebdbd4a4d1bc48a5941bdf4d3a7a79282d8745 c97dc1c23c84da17ee1ca1d69ab9031d6c17ca96 -- cmd/msgvault/cmd/imap_folder_state_sync_test.go > "$RUNNER_TEMP/regression.patch"
          git checkout --detach 9eebdbd4a4d1bc48a5941bdf4d3a7a79282d8745
          git apply "$RUNNER_TEMP/regression.patch"
          set +e
          go test -json -tags "fts5 sqlite_vec" ./cmd/msgvault/cmd -run '^TestRunScheduledIMAPSync_AllMailCombinedRolesKeepTrashMark$' -count=1 > "$RUNNER_TEMP/baseline.json"
          result=$?
          set -e
          test "$result" -eq 1
          python3 - <<'PYVERIFY'
          import json, os
          from pathlib import Path
          events=[json.loads(line) for line in Path(os.environ['RUNNER_TEMP'], 'baseline.json').read_text().splitlines()]
          failures=[e['Test'] for e in events if e.get('Action')=='fail' and '/' in e.get('Test','')]
          output=''.join(e.get('Output','') for e in events)
          assert len(failures)==6, failures
          assert output.count('All Mail sightings do not prove a restore')==6, output
          print('PASS: all six full/filtered combined-role cases expose the original restore defect')
          PYVERIFY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: imap-all-mail-baseline
          path: ${{ runner.temp }}/baseline.json
          retention-days: 3
          if-no-files-found: ignore
