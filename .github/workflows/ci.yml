name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-tag-development-build:
    runs-on: macos-26
    timeout-minutes: 50
    env:
      GOFLAGS: -trimpath
      GOPROXY: https://proxy.golang.org|direct
      MSGVAULT_API_CONTRACT_BASE: e63c12de038c06fa2bedee2f6b069454af5006eb
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: cb20b35c3d008327a2fe870a8a885b8e4f07fef9
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      - uses: step-security/setup-bun@v2.1.3
        with:
          bun-version-file: web/package.json
      - name: Check formatting and generated API artifacts
        run: |
          go fmt ./...
          make api-generate
          git diff --exit-code
      - name: Verify focused behavior
        run: |
          go vet ./...
          go test -v -tags "fts5 sqlite_vec" ./internal/store ./cmd/msgvault/cmd ./internal/api ./internal/gmail ./internal/imap ./internal/msmail -run 'TestEmailTag|TestDaemonMessageTags|TestMessage(Tags|Keywords)|TestAPISchemaVersionContract|TestOpenAPI' -count=1
      - name: Build reviewed development binary
        run: |
          make build VERSION=dev-cb20b35c POSTHOG_PROJECT_KEY=
          git diff --exit-code
          mkdir -p "$RUNNER_TEMP/provider-tag-bin"
          mv msgvault "$RUNNER_TEMP/provider-tag-bin/msgvault-head"
          git rev-parse HEAD > "$RUNNER_TEMP/provider-tag-bin/head-commit.txt"
      - name: Check out unchanged base
        uses: actions/checkout@v7.0.1
        with:
          ref: e63c12de038c06fa2bedee2f6b069454af5006eb
          persist-credentials: false
      - name: Build base negative control
        run: |
          make build VERSION=dev-e63c12de POSTHOG_PROJECT_KEY=
          mv msgvault "$RUNNER_TEMP/provider-tag-bin/msgvault-base"
          git rev-parse HEAD > "$RUNNER_TEMP/provider-tag-bin/base-commit.txt"
          cd "$RUNNER_TEMP/provider-tag-bin"
          shasum -a 256 msgvault-head msgvault-base > SHA256SUMS
          tar -czf "$RUNNER_TEMP/provider-tag-macos.tar.gz" msgvault-head msgvault-base head-commit.txt base-commit.txt SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: provider-tag-macos-development
          path: ${{ runner.temp }}/provider-tag-macos.tar.gz
          retention-days: 1
          if-no-files-found: error
